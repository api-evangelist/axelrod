name: Axelrod
description: >-
  Axelrod is a Y Combinator (Summer 2026) startup building an autonomous operating
  layer for boutique, independent, and luxury hotels and resorts. Its software runs
  daily front-of-house and back-of-house operations, coordinating arrivals, rooms,
  rates, access, maintenance, supplies, and owner reporting inside the systems and
  teams a property already has in place, integrating with existing PMS, channel,
  pricing, and accounting platforms rather than requiring net-new tooling. Founded
  by Adrian Stoica and Saman Sayahpour, the company markets itself as "boutique
  hotels that run themselves" and reports being live across four continents with
  Michelin Key awarded and Marriott Luxury Collection properties. Axelrod does not
  currently publish a public API, developer portal, or documentation; this profile
  is maintained in the API Evangelist network as an enrichment lead.
